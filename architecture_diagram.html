<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CareerGrowth AI - System Architecture Diagram</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background: #f8fafc; color: #0f172a; display: flex; flex-direction: column; align-items: center; padding: 40px 20px; }
        .header { text-align: center; margin-bottom: 25px; }
        .header h1 { font-size: 24px; font-weight: 700; color: #1e293b; margin-bottom: 6px; }
        .header p { color: #64748b; font-size: 14px; }
        
        .controls { display: flex; gap: 12px; margin-bottom: 25px; }
        .btn { background: #4f46e5; color: white; border: none; padding: 10px 20px; border-radius: 8px; font-weight: 600; font-size: 14px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; box-shadow: 0 4px 12px rgba(79, 70, 229, 0.2); }
        .btn:hover { background: #4338ca; }
        .btn-secondary { background: white; color: #334155; border: 1px solid #cbd5e1; }
        .btn-secondary:hover { background: #f1f5f9; }

        .diagram-container { background: white; border: 1px solid #e2e8f0; border-radius: 16px; padding: 40px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05); max-width: 900px; width: 100%; display: flex; flex-direction: column; align-items: center; }
        svg { width: 100%; height: auto; max-width: 820px; }
    </style>
</head>
<body>

    <div class="header">
        <h1>CareerGrowth AI: System Architecture Diagram</h1>
        <p>High-Resolution Vector Diagram for IEEE Research Paper & Capstone Report</p>
    </div>

    <div class="controls">
        <button class="btn" onclick="window.print()">🖨️ Print / Save as PDF</button>
        <button class="btn btn-secondary" onclick="downloadSVG()">📥 Download Vector SVG</button>
    </div>

    <div class="diagram-container" id="diagramWrapper">
        <svg id="archSvg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 760" width="100%" height="100%">
            <defs>
                <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748b" />
                </marker>
                <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
                    <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.04"/>
                </filter>
            </defs>

            <!-- Title -->
            <text x="420" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a" font-family="system-ui, sans-serif">CareerGrowth AI</text>

            <!-- TOP BOX: FRONTEND -->
            <g transform="translate(230, 48)">
                <rect width="380" height="74" rx="14" fill="#f0fdf4" stroke="#3b82f6" stroke-width="1.8" filter="url(#shadow)"/>
                <text x="190" y="30" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">FRONTEND: Next.js 16 &amp; React 19 App</text>
                <!-- React Logo / Icon -->
                <circle cx="130" cy="52" r="7" fill="none" stroke="#0ea5e9" stroke-width="1.5"/>
                <ellipse cx="130" cy="52" rx="12" ry="4.5" fill="none" stroke="#0ea5e9" stroke-width="1.2" transform="rotate(30 130 52)"/>
                <ellipse cx="130" cy="52" rx="12" ry="4.5" fill="none" stroke="#0ea5e9" stroke-width="1.2" transform="rotate(-30 130 52)"/>
                <text x="195" y="56" text-anchor="middle" font-size="13" font-weight="500" fill="#475569">Responsive Design</text>
            </g>

            <!-- Branching arrows from Frontend to Row 1 -->
            <path d="M 320 122 L 320 150 L 135 150 L 135 178" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arrow)"/>
            <path d="M 420 122 L 420 178" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arrow)"/>
            <path d="M 520 122 L 520 150 L 705 150 L 705 178" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arrow)"/>

            <!-- ROW 1 - BOX 1: AUTHENTICATION (Red/Coral) -->
            <g transform="translate(30, 180)">
                <rect width="210" height="135" rx="12" fill="#fff1f2" stroke="#f43f5e" stroke-width="1.6" filter="url(#shadow)"/>
                <text x="105" y="28" text-anchor="middle" font-size="14" font-weight="700" fill="#be123c">AUTHENTICATION</text>
                
                <!-- Icon 1: User Login -->
                <g transform="translate(45, 45)">
                    <circle cx="16" cy="12" r="8" fill="none" stroke="#e11d48" stroke-width="1.6"/>
                    <path d="M 4 32 C 4 24, 28 24, 28 32" fill="none" stroke="#e11d48" stroke-width="1.6"/>
                    <text x="16" y="46" text-anchor="middle" font-size="11" font-weight="600" fill="#475569">User Login</text>
                </g>
                <!-- Icon 2: Session -->
                <g transform="translate(130, 45)">
                    <rect x="2" y="4" width="26" height="24" rx="4" fill="none" stroke="#e11d48" stroke-width="1.6"/>
                    <circle cx="15" cy="14" r="4" fill="none" stroke="#e11d48" stroke-width="1.4"/>
                    <text x="15" y="46" text-anchor="middle" font-size="11" font-weight="600" fill="#475569">Session</text>
                </g>
            </g>

            <!-- ROW 1 - BOX 2: COMMAND CENTER DASHBOARD (Green) -->
            <g transform="translate(260, 180)">
                <rect width="320" height="135" rx="12" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.6" filter="url(#shadow)"/>
                <text x="160" y="28" text-anchor="middle" font-size="14" font-weight="700" fill="#15803d">COMMAND CENTER DASHBOARD</text>
                
                <!-- Icon 1: Live Scorecards -->
                <g transform="translate(35, 45)">
                    <rect x="0" y="4" width="28" height="22" rx="3" fill="none" stroke="#16a34a" stroke-width="1.5"/>
                    <path d="M 4 20 L 10 14 L 16 18 L 24 9" fill="none" stroke="#16a34a" stroke-width="1.5"/>
                    <text x="14" y="44" text-anchor="middle" font-size="11" font-weight="600" fill="#475569">Live</text>
                    <text x="14" y="56" text-anchor="middle" font-size="11" font-weight="600" fill="#475569">Scorecards</text>
                </g>
                <!-- Icon 2: Skill Radar -->
                <g transform="translate(140, 45)">
                    <circle cx="14" cy="15" r="12" fill="none" stroke="#16a34a" stroke-width="1.5"/>
                    <circle cx="14" cy="15" r="6" fill="none" stroke="#16a34a" stroke-width="1.2"/>
                    <path d="M 14 15 L 24 8" fill="none" stroke="#16a34a" stroke-width="1.5"/>
                    <text x="14" y="44" text-anchor="middle" font-size="11" font-weight="600" fill="#475569">Skill</text>
                    <text x="14" y="56" text-anchor="middle" font-size="11" font-weight="600" fill="#475569">Radar</text>
                </g>
                <!-- Icon 3: Roadmap Progress -->
                <g transform="translate(245, 45)">
                    <circle cx="6" cy="10" r="4" fill="none" stroke="#16a34a" stroke-width="1.5"/>
                    <circle cx="22" cy="20" r="4" fill="none" stroke="#16a34a" stroke-width="1.5"/>
                    <path d="M 10 10 Q 16 10, 18 20" fill="none" stroke="#16a34a" stroke-width="1.5"/>
                    <text x="14" y="44" text-anchor="middle" font-size="11" font-weight="600" fill="#475569">Roadmap</text>
                    <text x="14" y="56" text-anchor="middle" font-size="11" font-weight="600" fill="#475569">Progress</text>
                </g>
            </g>

            <!-- ROW 1 - BOX 3: RESUME & JD DIAGNOSTICS (Purple) -->
            <g transform="translate(600, 180)">
                <rect width="210" height="135" rx="12" fill="#faf5ff" stroke="#a855f7" stroke-width="1.6" filter="url(#shadow)"/>
                <text x="105" y="24" text-anchor="middle" font-size="13" font-weight="700" fill="#7e22ce">RESUME &amp; JD</text>
                <text x="105" y="38" text-anchor="middle" font-size="13" font-weight="700" fill="#7e22ce">DIAGNOSTICS</text>
                
                <!-- Icon 1: Upload Resume -->
                <g transform="translate(22, 48)">
                    <rect x="2" y="2" width="20" height="24" rx="3" fill="none" stroke="#9333ea" stroke-width="1.5"/>
                    <path d="M 12 18 L 12 8 M 8 12 L 12 8 L 16 12" fill="none" stroke="#9333ea" stroke-width="1.5"/>
                    <text x="12" y="42" text-anchor="middle" font-size="10" font-weight="600" fill="#475569">Upload</text>
                    <text x="12" y="53" text-anchor="middle" font-size="10" font-weight="600" fill="#475569">Resume</text>
                </g>
                <!-- Icon 2: Bullet Rewrites -->
                <g transform="translate(85, 48)">
                    <rect x="2" y="2" width="20" height="24" rx="3" fill="none" stroke="#9333ea" stroke-width="1.5"/>
                    <line x1="6" y1="8" x2="18" y2="8" stroke="#9333ea" stroke-width="1.5"/>
                    <line x1="6" y1="14" x2="18" y2="14" stroke="#9333ea" stroke-width="1.5"/>
                    <text x="12" y="42" text-anchor="middle" font-size="10" font-weight="600" fill="#475569">Bullet</text>
                    <text x="12" y="53" text-anchor="middle" font-size="10" font-weight="600" fill="#475569">Rewrites</text>
                </g>
                <!-- Icon 3: JD Skill Gap -->
                <g transform="translate(150, 48)">
                    <circle cx="12" cy="14" r="10" fill="none" stroke="#9333ea" stroke-width="1.5"/>
                    <path d="M 8 14 L 11 17 L 17 11" fill="none" stroke="#9333ea" stroke-width="1.5"/>
                    <text x="12" y="42" text-anchor="middle" font-size="10" font-weight="600" fill="#475569">JD Skill</text>
                    <text x="12" y="53" text-anchor="middle" font-size="10" font-weight="600" fill="#475569">Gap</text>
                </g>
            </g>

            <!-- Connector Down to Row 2 -->
            <path d="M 420 315 L 420 365" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arrow)"/>
            <path d="M 705 315 L 705 340 L 520 340 L 520 365" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arrow)"/>

            <!-- ROW 2 - SIDE BOX LEFT: DYNAMIC EDGE ROUTING (Amber) -->
            <g transform="translate(30, 380)">
                <rect width="210" height="95" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.6" filter="url(#shadow)"/>
                <text x="105" y="32" text-anchor="middle" font-size="12" font-weight="700" fill="#b45309">DYNAMIC EDGE</text>
                <text x="105" y="48" text-anchor="middle" font-size="12" font-weight="700" fill="#b45309">ROUTING</text>
                <text x="105" y="70" text-anchor="middle" font-size="11" font-weight="500" fill="#78350f">Serverless Handlers</text>
            </g>

            <!-- Horizontal arrows connecting Middle Row -->
            <path d="M 290 425 L 246 425" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arrow)"/>
            <path d="M 550 425 L 594 425" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arrow)"/>

            <!-- ROW 2 - CENTER BOX: 5-ROUND MOCK INTERVIEW STUDIO (Pink) -->
            <g transform="translate(290, 368)">
                <rect width="260" height="120" rx="12" fill="#fdf2f8" stroke="#ec4899" stroke-width="1.6" filter="url(#shadow)"/>
                <text x="130" y="24" text-anchor="middle" font-size="13" font-weight="700" fill="#be185d">5-ROUND MOCK</text>
                <text x="130" y="38" text-anchor="middle" font-size="13" font-weight="700" fill="#be185d">INTERVIEW STUDIO</text>
                
                <!-- Icon 1: Role Select -->
                <g transform="translate(30, 48)">
                    <circle cx="12" cy="10" r="6" fill="none" stroke="#db2777" stroke-width="1.5"/>
                    <path d="M 4 24 C 4 18, 20 18, 20 24" fill="none" stroke="#db2777" stroke-width="1.5"/>
                    <text x="12" y="38" text-anchor="middle" font-size="10" font-weight="600" fill="#475569">Role</text>
                    <text x="12" y="49" text-anchor="middle" font-size="10" font-weight="600" fill="#475569">Select</text>
                </g>
                <!-- Icon 2: Dynamic Questions -->
                <g transform="translate(115, 48)">
                    <rect x="2" y="2" width="20" height="22" rx="3" fill="none" stroke="#db2777" stroke-width="1.5"/>
                    <text x="12" y="16" text-anchor="middle" font-size="13" font-weight="700" fill="#db2777">?</text>
                    <text x="12" y="38" text-anchor="middle" font-size="10" font-weight="600" fill="#475569">Dynamic</text>
                    <text x="12" y="49" text-anchor="middle" font-size="10" font-weight="600" fill="#475569">Questions</text>
                </g>
                <!-- Icon 3: 5-Round Loop -->
                <g transform="translate(200, 48)">
                    <circle cx="12" cy="12" r="10" fill="none" stroke="#db2777" stroke-width="1.5" stroke-dasharray="14 4"/>
                    <text x="12" y="38" text-anchor="middle" font-size="10" font-weight="600" fill="#475569">5-Round</text>
                    <text x="12" y="49" text-anchor="middle" font-size="10" font-weight="600" fill="#475569">Loop</text>
                </g>
            </g>

            <!-- ROW 2 - SIDE BOX RIGHT: FEEDBACK & ANALYTICS (Yellow/Gold) -->
            <g transform="translate(600, 368)">
                <rect width="210" height="120" rx="12" fill="#fefce8" stroke="#eab308" stroke-width="1.6" filter="url(#shadow)"/>
                <text x="105" y="28" text-anchor="middle" font-size="13" font-weight="700" fill="#a16207">FEEDBACK &amp; ANALYTICS</text>
                
                <!-- Icon 1: Rating System -->
                <g transform="translate(22, 42)">
                    <path d="M 12 2 L 15 8 L 22 9 L 17 14 L 18 21 L 12 17 L 6 21 L 7 14 L 2 9 L 9 8 Z" fill="none" stroke="#ca8a04" stroke-width="1.3"/>
                    <text x="12" y="36" text-anchor="middle" font-size="10" font-weight="600" fill="#475569">Rating</text>
                    <text x="12" y="47" text-anchor="middle" font-size="10" font-weight="600" fill="#475569">System</text>
                </g>
                <!-- Icon 2: Strengths -->
                <g transform="translate(85, 42)">
                    <circle cx="12" cy="12" r="10" fill="none" stroke="#ca8a04" stroke-width="1.4"/>
                    <path d="M 8 12 L 11 15 L 16 9" fill="none" stroke="#ca8a04" stroke-width="1.5"/>
                    <text x="12" y="36" text-anchor="middle" font-size="10" font-weight="600" fill="#475569">Strengths</text>
                </g>
                <!-- Icon 3: Tailored Model Answers -->
                <g transform="translate(150, 42)">
                    <rect x="2" y="2" width="20" height="20" rx="3" fill="none" stroke="#ca8a04" stroke-width="1.4"/>
                    <line x1="6" y1="7" x2="18" y2="7" stroke="#ca8a04" stroke-width="1.3"/>
                    <line x1="6" y1="12" x2="14" y2="12" stroke="#ca8a04" stroke-width="1.3"/>
                    <text x="12" y="36" text-anchor="middle" font-size="10" font-weight="600" fill="#475569">Tailored</text>
                    <text x="12" y="47" text-anchor="middle" font-size="10" font-weight="600" fill="#475569">Answers</text>
                </g>
            </g>

            <!-- Connector Down to Bottom Row -->
            <path d="M 420 488 L 420 535" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arrow)"/>

            <!-- ROW 3 - BOTTOM BOX: VOICE CAPTURE & INFERENCE (Grey/Slate) -->
            <g transform="translate(220, 540)">
                <rect width="400" height="120" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="1.6" filter="url(#shadow)"/>
                <text x="200" y="26" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">VOICE CAPTURE &amp; INFERENCE</text>
                
                <!-- Icon 1: Microphone -->
                <g transform="translate(30, 42)">
                    <rect x="8" y="2" width="10" height="16" rx="5" fill="none" stroke="#475569" stroke-width="1.5"/>
                    <path d="M 4 10 C 4 18, 22 18, 22 10" fill="none" stroke="#475569" stroke-width="1.5"/>
                    <line x1="13" y1="18" x2="13" y2="24" stroke="#475569" stroke-width="1.5"/>
                    <text x="13" y="38" text-anchor="middle" font-size="10" font-weight="600" fill="#475569">Microphone</text>
                    <text x="13" y="49" text-anchor="middle" font-size="10" font-weight="600" fill="#475569">Audio</text>
                </g>
                <!-- Icon 2: Web Speech API -->
                <g transform="translate(130, 42)">
                    <circle cx="14" cy="12" r="10" fill="none" stroke="#475569" stroke-width="1.5"/>
                    <path d="M 9 12 Q 14 6, 19 12" fill="none" stroke="#475569" stroke-width="1.3"/>
                    <path d="M 6 12 Q 14 2, 22 12" fill="none" stroke="#475569" stroke-width="1.3"/>
                    <text x="14" y="38" text-anchor="middle" font-size="10" font-weight="600" fill="#475569">Web Speech</text>
                    <text x="14" y="49" text-anchor="middle" font-size="10" font-weight="600" fill="#475569">API</text>
                </g>
                <!-- Icon 3: Real-Time Transcription -->
                <g transform="translate(235, 42)">
                    <rect x="4" y="2" width="20" height="22" rx="3" fill="none" stroke="#475569" stroke-width="1.5"/>
                    <line x1="8" y1="7" x2="20" y2="7" stroke="#475569" stroke-width="1.3"/>
                    <line x1="8" y1="12" x2="20" y2="12" stroke="#475569" stroke-width="1.3"/>
                    <line x1="8" y1="17" x2="15" y2="17" stroke="#475569" stroke-width="1.3"/>
                    <text x="14" y="38" text-anchor="middle" font-size="10" font-weight="600" fill="#475569">Real-Time</text>
                    <text x="14" y="49" text-anchor="middle" font-size="10" font-weight="600" fill="#475569">Transcript</text>
                </g>
                <!-- Icon 4: Groq Llama-3.3-70B -->
                <g transform="translate(330, 42)">
                    <circle cx="14" cy="12" r="10" fill="none" stroke="#475569" stroke-width="1.5"/>
                    <circle cx="14" cy="12" r="4" fill="#475569"/>
                    <text x="14" y="38" text-anchor="middle" font-size="10" font-weight="600" fill="#475569">Groq</text>
                    <text x="14" y="49" text-anchor="middle" font-size="10" font-weight="600" fill="#475569">Llama-3.3</text>
                </g>
            </g>

            <!-- Bottom Caption -->
            <text x="420" y="720" text-anchor="middle" font-size="15" font-weight="600" fill="#1e293b" font-style="italic">Fig. 1.  Architecture</text>
        </svg>
    </div>

    <script>
        function downloadSVG() {
            const svgData = document.getElementById('archSvg').outerHTML;
            const blob = new Blob([svgData], { type: 'image/svg+xml;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'Fig1_CareerGrowth_AI_Architecture.svg';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }
    </script>
</body>
</html>
